{% extends 'base_tienda.html' %}{% block titulo %}Iniciar sesión · Tienda Estilo Moda{% endblock %}{% block contenido %}<section class="container py-5"><div class="auth-card mx-auto"><p class="eyebrow">CUENTA TSM</p><h1 class="h2 fw-bold">Iniciar sesión</h1><p class="text-secondary">Entra para ver tus favoritos y pedidos.</p><form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next_url }}"><div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" id="correo" name="correo" type="email" autocomplete="email" required maxlength="160"></div><div class="mb-3"><label class="form-label" for="contrasena">Contraseña</label><input class="form-control" id="contrasena" name="contrasena" type="password" autocomplete="current-password" required></div><button class="btn btn-dark btn-lg w-100" type="submit">Entrar</button></form><p class="small text-secondary mt-3 mb-0">¿Aún no tienes cuenta? <a href="{{ url_for('registro', next=next_url) }}">Regístrate aquí</a>.</p></div></section>{% endblock %}
