{% extends 'base.html' %}
{% block titulo %}Editar producto · Tienda Estilo Moda{% endblock %}
{% block encabezado %}Editar producto{% endblock %}
{% block bajada %}Actualiza los datos del producto seleccionado en el inventario.{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <section class="card admin-card shadow-sm"><div class="card-body p-4 p-lg-5">
      <form method="post" action="{{ url_for('editar', id=alumno._id) }}" class="row g-3">
        <div class="col-md-6"><label for="nombre" class="form-label">Producto</label><input id="nombre" name="nombre" class="form-control" value="{{ alumno.nombre }}" required maxlength="80"></div>
        <div class="col-md-3"><label for="categoria" class="form-label">Categoría</label><input id="categoria" name="categoria" class="form-control" value="{{ alumno.categoria }}" required maxlength="20"></div>
        <div class="col-md-3"><label for="estado" class="form-label">Estado</label><select id="estado" name="estado" class="form-select" required><option value="">Selecciona</option>{% for opcion in ['Disponible', 'Agotado'] %}<option value="{{ opcion }}" {% if alumno.get('estado') == opcion %}selected{% endif %}>{{ opcion }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label for="precio" class="form-label">Precio (MXN)</label><div class="input-group"><span class="input-group-text">$</span><input id="precio" name="precio" type="number" class="form-control" min="0.01" step="0.01" value="{{ '%.2f'|format(alumno.get('precio', 0)) }}" required></div></div>
        <div class="col-md-8"><label for="imagen" class="form-label">URL de imagen (opcional)</label><input id="imagen" name="imagen" type="url" class="form-control" value="{{ alumno.get('imagen', '') }}" placeholder="https://ejemplo.com/producto.jpg"></div>
        <div class="col-12"><label for="descripcion" class="form-label">Descripción</label><textarea id="descripcion" name="descripcion" class="form-control" rows="3" maxlength="1200">{{ alumno.get('descripcion', '') }}</textarea></div>
        <div class="col-12 d-flex flex-wrap gap-2 pt-2"><button type="submit" class="btn btn-dark px-4">Guardar cambios</button><a class="btn btn-outline-secondary" href="{{ url_for('inicio') }}#lista">Cancelar</a></div>
      </form>
    </div></section>
  </div>
</div>
{% endblock %}
